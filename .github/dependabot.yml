version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # mcp 2.x restructures mcp.server.fastmcp, which this codebase
      # imports directly - without this, Dependabot proposes the major
      # bump again every few weeks even after it's closed.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
